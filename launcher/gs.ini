# Graphics (RuleOfRose.exe rewrites this from its settings). [gs]: renderer = auto | d3d11 | d3d12 | vulkan | opengl;
# upscale = internal resolution multiplier; texture_filtering = ps2 | forced | nearest.
# Other sections go to PCSX2's GS as they are (e.g. [EmuCore/GS] AspectRatio).
[gs]
renderer = auto
upscale = 2
texture_filtering = ps2

[EmuCore/GS]
AspectRatio = 4:3
