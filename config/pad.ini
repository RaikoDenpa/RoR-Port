# Rule of Rose pad mapping (src/ror_pad.cpp reads it; ROR_PAD_CONFIG overrides the path).
#
# Raw libpad2 data as bedpad 0x101ccc reads it from 0x26d320: u16 buttons at +0, active-low, then four stick bytes
# +2..+5 centred at 0x80. Bit order = PS2Recomp's ps2_pad.cpp (DualShock report bytes 3-4): select 0, l3 1, r3 2,
# start 3, up 4, right 5, down 6, left 7, l2 8, r2 9, l1 10, r1 11, triangle 12, circle 13, cross 14, square 15.
#
# button   = inputs, any of which presses it
#   key:NAME       keyboard key (raylib KEY_ names without the prefix: A, ENTER, LEFT_SHIFT, KP_0, ...)
#   pad:NAME       gamepad 0 button (raylib GAMEPAD_BUTTON_ names: RIGHT_FACE_DOWN, MIDDLE_RIGHT, ...)
# stickN   = axis inputs for raw byte +N (N = 2..5)
#   axis:NAME      gamepad 0 axis (LEFT_X, LEFT_Y, RIGHT_X, RIGHT_Y), -1..1 -> 0x01..0xff
#   key-:NAME / key+:NAME   keyboard key that pushes the stick to 0x00 / 0xff
# The stick byte order (right X, right Y, left X, left Y) follows ps2_pad.cpp; UNVERIFIED for this game.

select   = key:TAB pad:MIDDLE_LEFT
l3       = pad:LEFT_THUMB
r3       = pad:RIGHT_THUMB
start    = key:ENTER pad:MIDDLE_RIGHT
up       = key:UP pad:LEFT_FACE_UP
right    = key:RIGHT pad:LEFT_FACE_RIGHT
down     = key:DOWN pad:LEFT_FACE_DOWN
left     = key:LEFT pad:LEFT_FACE_LEFT
l2       = key:ONE pad:LEFT_TRIGGER_2
r2       = key:THREE pad:RIGHT_TRIGGER_2
l1       = key:Q pad:LEFT_TRIGGER_1
r1       = key:E pad:RIGHT_TRIGGER_1
triangle = key:V pad:RIGHT_FACE_UP
circle   = key:C key:BACKSPACE pad:RIGHT_FACE_RIGHT
cross    = key:X key:SPACE pad:RIGHT_FACE_DOWN
square   = key:Z pad:RIGHT_FACE_LEFT

stick2   = axis:RIGHT_X key-:J key+:L
stick3   = axis:RIGHT_Y key-:I key+:K
stick4   = axis:LEFT_X key-:A key+:D
stick5   = axis:LEFT_Y key-:W key+:S
