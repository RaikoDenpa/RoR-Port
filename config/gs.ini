# PCSX2's GS settings for ROR_GS=pcsx2 (pcsx2-ror.dll's ror_pcsx2_gs_config; notes/renderer.md 6.13).
# build.py run passes this file (ROR_GS_INI); ror-gsreplay takes it with --gs-ini. The values below are PCSX2's
# defaults, which the regression references (gs_regress.py) were made with.
#
# [gs]
#   renderer          = auto | d3d11 | d3d12 | vulkan | opengl | software
#   upscale           = 1 .. 12   internal resolution multiplier (1 = the PS2's 640x448 framebuffer, 2 = 1280x896, ...)
#   texture_filtering = ps2 | nearest | forced | forced_no_sprites
#                       ps2: bilinear where the game asks for it (as on the console)
# Any other section is passed to PCSX2 as its own ini section, e.g. [EmuCore/GS] with PCSX2's keys
# (pcsx2/Pcsx2Config.cpp, GSOptions::LoadSave). Widescreen: later (needs the game's projection, not a GS setting).

[gs]
renderer = auto
upscale = 1
texture_filtering = ps2
